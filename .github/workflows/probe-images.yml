name: Probe auction images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-images.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe alternate image URLs
        shell: bash
        run: |
          set -e
          for id in             1w70h_qryNNGI3e9LhMIR6eMXZTcQWzIe             1D7Ihc9pnYFxIsi20ymG052khn8G787h8             1nsl2svE5xcVytgyWwDYlQKj27Kvq4l3m
          do
            echo "=== $id ==="
            for url in               "https://drive.google.com/thumbnail?id=$id&sz=w1600"               "https://lh3.googleusercontent.com/d/$id=w1600"               "https://drive.usercontent.google.com/download?id=$id&export=view"
            do
              echo "$url"
              curl -L -sS --max-time 30 -A 'Mozilla/5.0' -e 'https://planthunt.ru/auctions'                 -o /tmp/b -w 'http=%{http_code} total=%{time_total} type=%{content_type} size=%{size_download} final=%{url_effective}\n' "$url"
              file /tmp/b || true
            done
          done
