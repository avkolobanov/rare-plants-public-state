name: Test publisher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-publisher.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Submit A009 pilot bid
        shell: bash
        env:
          BASE_URL: https://script.google.com/macros/s/AKfycbwqjj6hFQ3PGNNMeAXgLBWj5Nq6yAQh65XbR4JKlqV_7wuqPGtUIhJnavZAXv96rgyI0w/exec
        run: |
          payload='{"update_id":990000011,"message":{"message_id":9011,"from":{"id":999000011,"is_bot":false,"first_name":"TEST-A009","last_name":"PublicState"},"chat":{"id":999000011,"type":"private"},"date":1790782000,"text":"/bid A009-C01 1100"}}'
          curl -L -sS --max-time 120 -o /tmp/post.out -w 'http=%{http_code} total=%{time_total}\n'             -H 'Content-Type: application/json'             --data "$payload"             "$BASE_URL"
          head -c 300 /tmp/post.out || true
