name: Inspect live auctions page

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-live-auctions.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live page HTML
        shell: bash
        run: |
          set -e
          url="https://planthunt.ru/auctions"
          curl -L -sS --max-time 60 -o /tmp/page.html "$url"
          python -c 'from pathlib import Path; s=Path("/tmp/page.html").read_text(errors="replace"); n="AKfycbwqjj6hFQ3PGNNMeAXgLBWj5Nq6yAQh65XbR4JKlqV_7wuqPGtUIhJnavZAXv96rgyI0w"; i=s.find(n); print(s[max(0,i-4000):min(len(s),i+9000)] if i>=0 else "API_NOT_FOUND")'
