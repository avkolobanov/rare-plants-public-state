name: Validate static catalog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-static-catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate catalog and widget
        shell: bash
        run: |
          set -e
          catalog="https://avkolobanov.github.io/rare-plants-public-state/state/catalog.json"
          widget="https://script.google.com/macros/s/AKfycbwqjj6hFQ3PGNNMeAXgLBWj5Nq6yAQh65XbR4JKlqV_7wuqPGtUIhJnavZAXv96rgyI0w/exec?action=widget"

          ok=0
          for i in 1 2 3 4 5; do
            code="$(curl -L -sS --max-time 30 -o /tmp/catalog.json -w '%{http_code}' "$catalog")"
            echo "catalog_attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              python -c 'import json; d=json.load(open("/tmp/catalog.json")); print(json.dumps({"ids":[x.get("id") for x in d.get("auctions",[])],"counts":d.get("counts")},ensure_ascii=False)); assert "A009" in [x.get("id") for x in d.get("auctions",[])]'
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" = "1" ]

          curl -L -sS --max-time 120 -o /tmp/widget.js -w 'widget_http=%{http_code} total=%{time_total}\n' "$widget"
          grep -F 'function loadCatalog' /tmp/widget.js
          grep -F '/catalog.json?_' /tmp/widget.js
