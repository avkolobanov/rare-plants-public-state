name: Probe live catalog endpoint

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-live-catalog.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe action auctions
        shell: bash
        run: |
          set +e
          url="https://script.google.com/macros/s/AKfycbwqjj6hFQ3PGNNMeAXgLBWj5Nq6yAQh65XbR4JKlqV_7wuqPGtUIhJnavZAXv96rgyI0w/exec?action=auctions"
          curl -L -sS --max-time 120 -o /tmp/catalog.json -w 'http=%{http_code} total=%{time_total}\n' "$url"
          python -c 'import json; d=json.load(open("/tmp/catalog.json")); print(json.dumps({"ids":[x.get("id") for x in d.get("auctions",[])],"counts":d.get("counts"),"updatedAt":d.get("updatedAt")},ensure_ascii=False))' || head -c 1000 /tmp/catalog.json
