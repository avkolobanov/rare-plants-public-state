name: Verify live widget pilot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-widget.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed widget
        shell: bash
        env:
          URL: https://script.google.com/macros/s/AKfycbwqjj6hFQ3PGNNMeAXgLBWj5Nq6yAQh65XbR4JKlqV_7wuqPGtUIhJnavZAXv96rgyI0w/exec?action=widget
        run: |
          set -e
          curl -L -sS --max-time 120 -o /tmp/widget.js -w 'http=%{http_code} total=%{time_total}\n' "$URL"
          grep -F 'https://avkolobanov.github.io/rare-plants-public-state/state' /tmp/widget.js
          grep -F 'PUBLIC_STATE_PILOT_AUCTION_ID' /tmp/widget.js
